<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="610" viewBox="0 0 1100 610" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#111">
  <defs>
    <style>text { fill: #111; stroke: none; }</style>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>
  <rect width="1100" height="610" fill="#fff"/>
  <g stroke="#111" stroke-width="1.2" fill="#fff">

  <!-- ======================= (a) ======================= -->
  <text x="20" y="32" stroke="none"><tspan font-weight="bold">(a)</tspan> Inference</text>

  <!-- quan sát: 2 frame thật -->
  <image x="34" y="66" width="62" height="62" xlink:href="data:image/png;base64,"/>
  <rect x="34" y="66" width="62" height="62" fill="none"/>
  <image x="46" y="78" width="62" height="62" xlink:href="data:image/png;base64,"/>
  <rect x="46" y="78" width="62" height="62" fill="none"/>
  <text x="71" y="162" text-anchor="middle" stroke="none">o<tspan baseline-shift="sub" font-size="10">t−1</tspan>, o<tspan baseline-shift="sub" font-size="10">t</tspan></text>

  <!-- World Model (nhóm nét đứt) -->
  <rect x="138" y="58" width="330" height="200" fill="none" stroke-dasharray="6 4"/>
  <text x="148" y="76" font-size="13" font-style="italic" stroke="none">World Model</text>

  <rect x="155" y="92" width="120" height="50"/>
  <text x="215" y="114" text-anchor="middle" stroke="none">DINOv2</text>
  <text x="215" y="132" text-anchor="middle" font-size="12" stroke="none">+ PCA</text>

  <rect x="330" y="92" width="120" height="50"/>
  <text x="390" y="122" text-anchor="middle" stroke="none">Transformer</text>

  <rect x="155" y="196" width="120" height="44"/>
  <text x="215" y="223" text-anchor="middle" stroke="none">PoseHead</text>

