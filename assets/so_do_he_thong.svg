    <polyline points="704.0,150.0 714.3,147.7 724.8,146.9 735.4,147.6 746.0,149.7 756.4,153.3 766.4,158.3 776.0,164.8 784.9,172.6" fill="none" stroke="#9a9a9a" stroke-width="1"/>
    <polyline points="704.0,150.0 713.3,145.0 722.2,139.5 730.7,133.2 738.8,126.4 746.4,119.0 753.5,111.1 760.2,102.6 766.2,93.6" fill="none" stroke="#9a9a9a" stroke-width="1"/>
    <polyline points="704.0,150.0 712.7,144.2 721.8,138.9 731.3,134.3 741.2,130.4 751.3,127.2 761.7,124.6 772.3,122.7 783.1,121.6" fill="none" stroke="#9a9a9a" stroke-width="1"/>
    <polyline points="704.0,150.0 710.8,142.0 716.5,133.1 720.9,123.4 724.0,113.1 725.7,102.2 726.0,91.0 724.8,79.5 722.1,68.0" fill="none" stroke="#111" stroke-width="1.8"/>
    <polyline points="704.0,150.0 710.0,141.4 716.0,132.8 722.0,124.2 728.0,115.5 734.0,106.9 740.0,98.3 746.0,89.7 752.0,81.1" fill="none" stroke="#9a9a9a" stroke-width="1"/>
    <polyline points="704.0,150.0 709.1,140.8 715.5,132.4 723.1,124.9 731.7,118.4 741.3,113.0 751.7,108.9 762.9,106.0 774.7,104.6" fill="none" stroke="#9a9a9a" stroke-width="1"/>
    <polyline points="704.0,150.0 706.5,139.8 708.2,129.4 709.2,118.9 709.5,108.4 709.0,97.7 707.8,87.1 705.9,76.5 703.2,66.0" fill="none" stroke="#9a9a9a" stroke-width="1"/>
  </g>
  <circle cx="704" cy="150" r="3.5" fill="#111"/>
  <text x="749" y="180" text-anchor="middle" stroke="none">τ<tspan baseline-shift="sub" font-size="10">1</tspan> … τ<tspan baseline-shift="sub" font-size="10">16</tspan></text>

  <!-- PD nghịch -->
  <rect x="860" y="92" width="120" height="50"/>
  <text x="920" y="114" text-anchor="middle" stroke="none">PD<tspan baseline-shift="super" font-size="10">−1</tspan></text>
  <text x="920" y="132" text-anchor="middle" font-size="12" stroke="none">closed-form</text>

  <!-- chọn + môi trường -->
  <rect x="155" y="296" width="120" height="44"/>
  <text x="215" y="323" text-anchor="middle" stroke="none">argmin C</text>

  <rect x="20" y="296" width="102" height="44"/>
  <text x="71" y="323" text-anchor="middle" stroke="none">gym-pusht</text>

  <!-- mũi tên -->
  <path d="M108,117 H153" fill="none" marker-end="url(#a)"/>
  <path d="M275,117 H328" fill="none" marker-end="url(#a)"/>
  <text x="312" y="136" text-anchor="middle" stroke="none">s<tspan baseline-shift="sub" font-size="10">t</tspan></text>
  <path d="M300,117 V40 H585 V90" fill="none" marker-end="url(#a)"/>
  <circle cx="300" cy="117" r="2.5" fill="#111"/>
  <text x="440" y="34" text-anchor="middle" stroke="none">s<tspan baseline-shift="sub" font-size="10">t</tspan>, p<tspan baseline-shift="sub" font-size="10">t</tspan></text>
  <path d="M450,117 H518" fill="none" marker-end="url(#a)"/>
  <text x="484" y="110" text-anchor="middle" stroke="none">h<tspan baseline-shift="sub" font-size="10">t</tspan></text>
  <path d="M650,117 H692" fill="none" marker-end="url(#a)"/>
  <path d="M804,117 H858" fill="none" marker-end="url(#a)"/>

  <!-- action quay về Transformer để rollout -->
  <path d="M920,142 V286 H420 V144" fill="none" marker-end="url(#a)"/>
  <text x="670" y="277" text-anchor="middle" stroke="none">a<tspan baseline-shift="sub" font-size="10">1</tspan> … a<tspan baseline-shift="sub" font-size="10">16</tspan>  (16-step rollout)</text>

  <path d="M360,142 V218 H277" fill="none" marker-end="url(#a)"/>
  <text x="318" y="210" text-anchor="middle" stroke="none">ŝ</text>
  <path d="M215,240 V294" fill="none" marker-end="url(#a)"/>
  <text x="230" y="272" stroke="none">b̂, ĉ</text>
  <path d="M155,318 H124" fill="none" marker-end="url(#a)"/>
  <text x="139" y="310" text-anchor="middle" font-size="13" stroke="none">a*</text>
  <path d="M71,296 V170" fill="none" marker-end="url(#a)" stroke-dasharray="none"/>
  <text x="78" y="246" stroke="none">o<tspan baseline-shift="sub" font-size="10">t+8</tspan></text>

  <!-- ======================= (b) ======================= -->
  <text x="20" y="400" stroke="none"><tspan font-weight="bold">(b)</tspan> Training</text>

  <rect x="40"  y="420" width="140" height="48"/>
  <text x="110" y="449" text-anchor="middle" stroke="none">Load data</text>
  <rect x="220" y="420" width="140" height="48"/>
  <text x="290" y="440" text-anchor="middle" stroke="none">Setup</text>
  <text x="290" y="457" text-anchor="middle" stroke="none">simulation</text>
  <rect x="400" y="420" width="140" height="48"/>
  <text x="470" y="440" text-anchor="middle" stroke="none">Train</text>
  <text x="470" y="457" text-anchor="middle" stroke="none">World Model</text>
  <rect x="580" y="420" width="140" height="48"/>
  <text x="650" y="440" text-anchor="middle" stroke="none">Train</text>
  <text x="650" y="457" text-anchor="middle" stroke="none">Diffusion</text>
  <rect x="760" y="420" width="140" height="48"/>
  <text x="830" y="449" text-anchor="middle" stroke="none">Evaluate</text>
  <rect x="940" y="420" width="140" height="48"/>
  <text x="1010" y="449" text-anchor="middle" stroke="none">Self-play</text>

  <path d="M180,444 H218" fill="none" marker-end="url(#a)"/>
  <path d="M360,444 H398" fill="none" marker-end="url(#a)"/>
  <path d="M540,444 H578" fill="none" marker-end="url(#a)"/>
  <path d="M720,444 H758" fill="none" marker-end="url(#a)"/>
  <path d="M900,444 H938" fill="none" marker-end="url(#a)"/>
  <path d="M1010,468 V500 H470 V470" fill="none" marker-end="url(#a)"/>
  <text x="740" y="518" text-anchor="middle" stroke="none">D<tspan baseline-shift="sub" font-size="10">self</tspan> → retrain World Model</text>

  <text x="40" y="562" stroke="none">World Model loss = MSE latent (1-step + 16-step) + 10·MSE coverage + L1 pose + FDE / 256,     FDE = √(Δx² + Δy²) + 60·|Δθ|</text>
  <text x="40" y="590" stroke="none">Diffusion loss = E ‖ ε − ε<tspan baseline-shift="sub" font-size="10">θ</tspan>(τ<tspan baseline-shift="super" font-size="10">k</tspan>, k | s<tspan baseline-shift="sub" font-size="10">t</tspan>, h<tspan baseline-shift="sub" font-size="10">t</tspan>, p<tspan baseline-shift="sub" font-size="10">t</tspan>) ‖²</text>
  </g>
</svg>
