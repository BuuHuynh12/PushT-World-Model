  <rect x="520" y="92" width="130" height="50"/>
  <text x="585" y="114" text-anchor="middle" stroke="none">Diffusion</text>
  <text x="585" y="132" text-anchor="middle" font-size="12" stroke="none">U-Net 1D</text>

  <!-- chùm quỹ đạo -->
  <rect x="694" y="72" width="110" height="88" fill="none" stroke="#999" stroke-width="0.8"/>
  <g stroke-linecap="round">
    <polyline points="704.0,150.0 714.5,149.8 724.9,148.1 735.1,145.0 744.9,140.4 754.2,134.5 762.7,127.2 770.5,118.7 777.3,109.0" fill="none" stroke="#9a9a9a" stroke-width="1"/>
