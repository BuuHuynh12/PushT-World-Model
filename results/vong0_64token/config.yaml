seed: 42
encoder: dinov2
datasets:
- demo
- sim_v1
val_ratio: 0.05
out_dir: outputs/loop/r0/wm_tok64
pool: 0
model:
  d_model: 256
  n_layers: 6
  n_heads: 4
  window: 4
  dropout: 0.0
  pose_head: true
train:
  steps: 30000
  batch_size: 64
  lr: 0.0003
  weight_decay: 0.01
  warmup_steps: 1000
  n_ctx: 2
  n_roll: 8
  w_reward: 10.0
  w_fde: 1.0
  w_pose: 1.0
  fde_r: 60.0
  amp: bf16
  grad_clip: 1.0
  log_every: 100
  val_every: 2000
  val_windows: 512
  eval_horizon: 16
